# This workflow will upload a Python Package to PyPI when a release is created
# Modified for uv package manager

name: Upload Python Package to PyPI

on:
  release:
    types: [released]

permissions:
  contents: read

jobs:
  release-build:
    uses: ./.github/workflows/release-build.yml

  pypi-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - release-build
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
      # Required for uploading release assets
      contents: write

    # Dedicated environments with protections for publishing are strongly recommended.
    environment:
      name: pypi
      url: https://pypi.org/project/nemdatatools/

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Retrieve release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist/

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Upload release assets
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test install the exact version from PyPI
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # Retry installation with backoff
          for i in {1..3}; do
            echo "Installation attempt $i..."
            if pip install "nemdatatools==$TAG_VERSION"; then
              python -c "import nemdatatools; print(f'✅ Successfully installed nemdatatools v{nemdatatools.__version__}')"
              exit 0
            fi
            sleep $((30 * i))
          done
          echo "❌ Installation failed after 3 attempts"
          exit 1
