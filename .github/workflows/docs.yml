name: Documentation

on:
  push:
    branches: [ master ]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'pyproject.toml'
      - 'README.md'
  pull_request:
    branches: [ master ]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'pyproject.toml'
      - 'README.md'
  workflow_dispatch:

  # Schedule a monthly build of the documentation
  schedule:
    - cron: '0 0 1 * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

    - name: Install uv and Python
      uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      with:
        python-version: '3.11'
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Install locked dependencies
      run: |
        uv sync --locked --extra docs

    - name: Build documentation
      run: |
        if [ ! -f "docs/conf.py" ]; then
          echo "Warning: docs/conf.py not found. Please create proper Sphinx documentation files."
          echo "Documentation build will be skipped. This is not considered a workflow failure."
          exit 0
        fi

        cd docs
        uv run --no-sync sphinx-build -b html -v . _build/html
        touch _build/html/.nojekyll

    - name: Archive documentation
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: documentation
        path: docs/_build/html

    - name: Deploy to GitHub Pages
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
      uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
      with:
        folder: docs/_build/html
        branch: gh-pages
        clean: true
        single-commit: false
